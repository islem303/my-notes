
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f0ff;
            color: #302747;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #a78bfa, #ec9bd6);
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 15px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        input, textarea {
            font: inherit;
            width: 100%;
            padding: 12px;
            border: 1px solid #ded3f7;
            border-radius: 10px;
            background: white;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #9b7bea;
        }

        #search {
            flex: 1;
            min-width: 180px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(0.97);
        }

        .add-btn, .save-btn {
            background: #8b6de9;
            color: white;
        }

        .clear-btn {
            background: #e9e1fa;
            color: #5a438a;
        }

        .editor {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 5px 20px #6c4a9910;
            margin-bottom: 25px;
        }

        .editor h2 {
            margin-bottom: 15px;
        }

        .editor input {
            margin-bottom: 12px;
        }

        .editor textarea {
            min-height: 130px;
            resize: vertical;
            margin-bottom: 12px;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .note {
            background: white;
            border-top: 5px solid #b9a2fa;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 5px 18px #6c4a9910;
            overflow-wrap: anywhere;
        }

        .note h3 {
            margin-bottom: 10px;
        }

        .note p {
            white-space: pre-wrap;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .note small {
            color: #827795;
            display: block;
            margin-bottom: 12px;
        }

        .note-actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn {
            background: #e8e0ff;
            color: #6045a4;
        }

        .delete-btn {
            background: #ffe3e9;
            color: #b52d50;
        }

        #message {
            margin-bottom: 12px;
            color: #6548a8;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #827795;
        }

        @media (max-width: 500px) {
            header h1 {
                font-size: 26px;
            }

            .container {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Notes ✨</h1>
        <p>Your little space for ideas, plans and dreams.</p>
    </header>

    <main class="container">

        <div class="toolbar">
            <input
                type="search"
                id="search"
                placeholder="🔍 Search your notes..."
                aria-label="Search notes"
            >
            <button class="add-btn" id="newBtn">+ Add Note</button>
            <button class="clear-btn" id="clearBtn">Clear Search</button>
        </div>

        <section class="editor" id="editor">
            <h2 id="editorTitle">Create a new note 📝</h2>

            <form id="noteForm">
                <input
                    type="text"
                    id="noteTitle"
                    placeholder="Note title..."
                    maxlength="100"
                    required
                >

                <textarea
                    id="noteContent"
                    placeholder="Write your note here..."
                    required
                ></textarea>

                <p id="message" role="status"></p>

                <button type="submit" class="save-btn">
                    💾 Save Note
                </button>

                <button type="button" class="clear-btn" id="cancelBtn">
                    Cancel
                </button>
            </form>
        </section>

        <h2 style="margin-bottom: 18px;">My Collection 📚</h2>

        <div class="notes-grid" id="notesGrid"></div>

    </main>

    <footer>
        Made with 💜 using HTML, CSS and JavaScript
    </footer>

    <script>
        const titleInput = document.getElementById("noteTitle");
        const contentInput = document.getElementById("noteContent");
        const noteForm = document.getElementById("noteForm");
        const notesGrid = document.getElementById("notesGrid");
        const editor = document.getElementById("editor");
        const message = document.getElementById("message");
        const search = document.getElementById("search");

        let notes = [];

        try {
            notes = JSON.parse(
                localStorage.getItem("myNotes") || "[]"
            );

            if (!Array.isArray(notes)) notes = [];
        } catch {
            notes = [];
        }

        let editingId = null;

        function saveToBrowser() {
            try {
                localStorage.setItem(
                    "myNotes",
                    JSON.stringify(notes)
                );
                return true;
            } catch {
                message.textContent =
                    "Could not save. Check your browser storage.";
                return false;
            }
        }

        function createElement(tag, className, text) {
            const element = document.createElement(tag);
            element.className = className;
            element.textContent = text;
            return element;
        }

        function renderNotes() {
            notesGrid.replaceChildren();

            const term = search.value.toLowerCase().trim();

            const filtered = notes.filter(note =>
                note.title.toLowerCase().includes(term) ||
                note.content.toLowerCase().includes(term)
            );

            if (filtered.length === 0) {
                notesGrid.append(
                    createElement(
                        "p",
                        "",
                        term
                            ? "No notes match your search."
                            : "No notes yet. Click + Add Note to begin!"
                    )
                );
                return;
            }

            filtered.forEach(note => {
                const card = createElement("article", "note", "");
                const heading = createElement("h3", "", note.title);
                const content = createElement("p", "", note.content);
                const date = createElement(
                    "small",
                    "",
                    "Created: " + note.date
                );

                const actions = createElement("div", "note-actions", "");

                const editBtn = createElement("button", "edit-btn", "✏️ Edit");
                editBtn.type = "button";
                editBtn.title = "Edit this note";
                editBtn.addEventListener("click", () => editNote(note.id));

                const deleteBtn = createElement(
                    "button",
                    "delete-btn",
                    "🗑️ Delete"
                );
                deleteBtn.type = "button";
                deleteBtn.title = "Delete this note";
                deleteBtn.addEventListener("click", () => deleteNote(note.id));

                actions.append(editBtn, deleteBtn);
                card.append(heading, content, date, actions);
                notesGrid.append(card);
            });
        }

        function resetEditor() {
            editingId = null;
            noteForm.reset();
            document.getElementById("editorTitle").textContent =
                "Create a new note 📝";
            message.textContent = "";
        }

        document.getElementById("newBtn").addEventListener("click", () => {
            resetEditor();
            editor.scrollIntoView({ behavior: "smooth" });
            titleInput.focus();
        });

        document.getElementById("cancelBtn").addEventListener("click", () => {
            resetEditor();
        });

        document.getElementById("clearBtn").addEventListener("click", () => {
            search.value = "";
            renderNotes();
        });

        search.addEventListener("input", renderNotes);

        noteForm.addEventListener("submit", event => {
            event.preventDefault();

            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (!title || !content) {
                message.textContent = "Please fill in both fields.";
                return;
            }

            const previousNotes = JSON.stringify(notes);

            if (editingId !== null) {
                const note = notes.find(item => item.id === editingId);
                if (note) {
                    note.title = title;
                    note.content = content;
                }
            } else {
                notes.unshift({
                    id: Date.now().toString() +
                        Math.random().toString(36).slice(2),
                    title,
                    content,
                    date: new Date().toLocaleDateString()
                });
            }

            if (!saveToBrowser()) {
                notes = JSON.parse(previousNotes);
                return;
            }

            resetEditor();
            renderNotes();
            message.textContent = "Note saved successfully! 💜";
        });

        function editNote(id) {
            const note = notes.find(item => item.id === id);
            if (!note) return;

            editingId = id;
            titleInput.value = note.title;
            contentInput.value = note.content;

            document.getElementById("editorTitle").textContent =
                "Edit your note ✏️";

            message.textContent = "";
            editor.scrollIntoView({ behavior: "smooth" });
        }

        function deleteNote(id) {
            if (!confirm("Are you sure you want to delete this note?")) {
                return;
            }

            const previousNotes = notes;
            notes = notes.filter(note => note.id !== id);

            if (!saveToBrowser()) {
                notes = previousNotes;
                return;
            }

            renderNotes();

            if (editingId === id) resetEditor();
        }

        renderNotes();
    </script>

</body>
</html>
